name: Format code

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  format-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⛓️ SLSA Supply Chain Security
        uses: ministryofjustice/devsecops-actions/sca/slsa@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0

      - uses: ministryofjustice/bichard7-next-core/.github/actions/code-formatter@main
        with:
          ignore-files: ".python-version"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
